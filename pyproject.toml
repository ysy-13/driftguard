[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftguard"
version = "0.1.0"
description = "Deterministic software-engineering sandbox for the DriftGuard benchmark"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "openapi-spec-validator>=0.7,<0.8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
