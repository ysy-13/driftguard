experiment:
  name: phase10_real_pilot
  pilot_attempt: v3
  run_scope: end_to_end_only
  prior_component_attempt: pilot_v2
  component_prompt_version: component_attribution_v2
  action_prompt_version: base_tool_agent_v2
  action_schema_version: agent_action_schema_v2
  mode: [end_to_end]
  real_llm: true
  repetitions: 1
  seeds: [20260715]
  families: [M01, M06, M11, M16]
models:
  - provider: deepseek
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.1
    top_p: 1.0
    max_output_tokens: 4096
    timeout_seconds: 120
    max_provider_retries: 3
    structured_output_mode: strict_json
    thinking_mode: disabled
    concurrency: 2
    capabilities: {seed: false, json_schema: false, strict_json: true, tool_calling: true}
  - provider: dashscope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_id: qwen3.7-plus
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.1
    top_p: 1.0
    max_output_tokens: 4096
    timeout_seconds: 120
    max_provider_retries: 3
    structured_output_mode: strict_json
    thinking_mode: disabled
    concurrency: 2
    capabilities: {seed: false, json_schema: false, strict_json: true, tool_calling: true}
methods:
  end_to_end: [standard, retry_only, reflection, validation_guided, driftguard_llm]
  component: [reflection, validation_guided, driftguard_llm]
  deterministic: [oracle_symbolic_upper_bound]
budget:
  pilot_hard_limit_cny: 50
  pilot_soft_limit_cny: 35
  full_hard_limit_cny: 1000
  full_soft_limit_cny: 800
  max_llm_calls_per_record: 8
  max_tool_calls_per_record: 12
  max_probe_calls_per_record: 4
  max_total_interactions_per_record: 16
  max_input_tokens_per_record: 60000
  max_output_tokens_per_record: 12000
  max_format_repairs: 1
  reserve_worst_case_before_call: true
execution:
  allow_real_api_required: true
  confirm_full_run_required: true
  cache_enabled: true
  resume_enabled: true
  checkpoint_interval: 1
  fail_fast_on_leakage: true
  fail_fast_on_budget: true
  task_state_isolation: true
  patch_registry_isolation: true
  history_isolation: true
  max_wall_time_seconds: 300
  parallelism: 2
  rate_limit_per_second: 2
